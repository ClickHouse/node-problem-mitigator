# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Job ServiceAccounts and RBAC
templates:
  - job-serviceaccounts.yaml
release:
  name: unit-test
  namespace: node-problem-mitigator

tests:
  - it: creates no Job ServiceAccounts when no jobs declare a block
    asserts:
      - hasDocuments:
          count: 0


  - it: ignores null Jobs
    set:
      jobs:
        removed: null
    asserts:
      - hasDocuments:
          count: 0
  - it: renders one ServiceAccount for Jobs sharing an identical declaration
    set:
      jobs:
        terminate:
          serviceAccount:
            name: shared
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/shared
          template: {}
        capture:
          serviceAccount:
            name: shared
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/shared
          template: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/shared

  - it: rejects Jobs that declare a shared ServiceAccount differently
    set:
      jobs:
        terminate:
          serviceAccount:
            name: shared
            annotations:
              example.com/key: one
          template: {}
        capture:
          serviceAccount:
            name: shared
          template: {}
    asserts:
      - failedTemplate:
          errorPattern: 'ServiceAccount "shared" is declared differently by Job "capture" and Job "terminate"'

  - it: renders RBAC for an existing ServiceAccount without creating the account
    set:
      jobs:
        capture:
          serviceAccount:
            create: false
            name: existing
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get"]
            clusterRules:
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["get"]
          template: {}
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 0
      - isKind:
          of: ClusterRole
        documentIndex: 2
      - equal:
          path: subjects[0].name
          value: existing
        documentIndex: 3

  - it: defaults account names from the Job name when the block is empty
    set:
      jobs:
        capture:
          serviceAccount: {}
          template: {}
    asserts:
      - equal:
          path: metadata.name
          value: unit-test-node-problem-mitigator-capture

  - it: rejects a Job that reuses the controller ServiceAccount
    set:
      jobs:
        capture:
          serviceAccount:
            name: unit-test-node-problem-mitigator
          template: {}
    asserts:
      - failedTemplate:
          errorPattern: 'Job "capture": ServiceAccount "unit-test-node-problem-mitigator" is the controller ServiceAccount'

  - it: requires a name for an existing Job ServiceAccount
    set:
      jobs:
        capture:
          serviceAccount:
            create: false
          template: {}
    asserts:
      - failedTemplate:
          errorPattern: 'Job "capture": serviceAccount.name is required'
