---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-problem-mitigator.fullname" . }}
  labels:
    {{- include "node-problem-mitigator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "node-problem-mitigator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: node-problem-mitigator
        {{- with .Values.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      labels:
        {{- include "node-problem-mitigator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "node-problem-mitigator.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ tpl (toString .) $ }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
      - name: node-problem-mitigator
        {{- $repository := tpl (toString .Values.image.repository) . }}
        {{- $tag := tpl (toString (.Values.image.tag | default .Chart.AppVersion)) . }}
        image: {{ printf "%s:%s" $repository $tag | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - --namespace={{ .Release.Namespace }}
          - --metrics-bind-address=:{{ .Values.serviceMonitor.port }}
          - --health-probe-bind-address=:8081
          - --leader-elect={{ .Values.app.leaderElect }}
          - --dry-run={{ .Values.app.dryRun }}
          {{- with .Values.extraArgs }}
          {{- tpl (toYaml .) $ | nindent 10 }}
          {{- end }}
        {{- with .Values.extraEnv }}
        env:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.serviceMonitor.port }}
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        {{- with .Values.resources }}
        resources:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      {{- with .Values.extraVolumes }}
      volumes:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
