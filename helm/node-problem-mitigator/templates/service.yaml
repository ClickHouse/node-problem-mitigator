---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-problem-mitigator.fullname" . }}
  labels:
    {{- include "node-problem-mitigator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.serviceMonitor.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "node-problem-mitigator.selectorLabels" . | nindent 4 }}
