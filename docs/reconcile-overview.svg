<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" viewBox="0 0 647 1561" width="647" height="1561" style="width:100vw;height:calc(100vw * 1561 / 647)"><svg class="d2-737221423 d2-svg" width="647" height="1561" viewBox="-19 -19 647 1561"><rect x="-19" y="-19" width="647" height="1561" rx="0" fill="#FFFFFF" class=" fill-N7" stroke-width="0" /><style type="text/css"><![CDATA[
