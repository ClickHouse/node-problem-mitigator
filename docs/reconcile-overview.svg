		.d2-737221423 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3Jj"><g class="shape" ><rect x="274" y="12" width="176" height="66" stroke="#4f46e5" fill="#ffffff" style="stroke-width:2;" /></g><text x="362" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Watch node object</text></g><g class="cDE= read"><g class="shape" ><rect x="159" y="123" width="407" height="146" stroke="#4f46e5" fill="#eef2ff" style="stroke-width:2;" /></g><text x="362.5" y="161.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="362.5" dy="0">1. Admission</tspan><tspan x="362.5" dy="16.833333"> </tspan><tspan x="362.5" dy="16.833333">Does the node still exist, and is the config loadable?</tspan><tspan x="362.5" dy="16.833333">Follow the node&#39;s launched mitigation Jobs.</tspan><tspan x="362.5" dy="16.833333"> </tspan><tspan x="362.5" dy="16.833333">leaves early if: node gone, config malformed</tspan></text></g><g class="cDI= read"><g class="shape" ><rect x="137" y="380" width="450" height="146" stroke="#4f46e5" fill="#eef2ff" style="stroke-width:2;" /></g><text x="362" y="418.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="362" dy="0">2. Resolve</tspan><tspan x="362" dy="16.833333"> </tspan><tspan x="362" dy="16.833333">Which condition owns this node, and which steps</tspan><tspan x="362" dy="16.833333">does it run? Eligible conditions merge into the steps.</tspan><tspan x="362" dy="16.833333"> </tspan><tspan x="362" dy="16.833333">leaves early if: still inside its &#34;for&#34; window, nothing firing</tspan></text></g><g class="cDM= read"><g class="shape" ><rect x="12" y="672" width="441" height="162" stroke="#4f46e5" fill="#eef2ff" style="stroke-width:2;" /></g><text x="232.5" y="710.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="232.5" dy="0">3. Gates</tspan><tspan x="232.5" dy="16.714286"> </tspan><tspan x="232.5" dy="16.714286">Is the controller allowed to start this mitigation,</tspan><tspan x="232.5" dy="16.714286">or add the taint to a running one?</tspan><tspan x="232.5" dy="16.714286"> </tspan><tspan x="232.5" dy="16.714286">leaves early if: disabled, excluded by label / annotation /</tspan><tspan x="232.5" dy="16.714286">taint / namespace, dry-run, global cooldown active</tspan></text></g><g class="cDQ= write"><g class="shape" ><rect x="13" y="977" width="439" height="146" stroke="#b45309" fill="#fff3d4" style="stroke-width:2;" /></g><text x="232.5" y="1015.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="232.5" dy="0">4. Commit</tspan><tspan x="232.5" dy="16.833333"> </tspan><tspan x="232.5" dy="16.833333">The controller persists the cooldown, then records</tspan><tspan x="232.5" dy="16.833333">the owner and steps, taints the node if the steps</tspan><tspan x="232.5" dy="16.833333">taint, and selects the pre-mitigation Job, in one update.</tspan><tspan x="232.5" dy="16.833333">A failed cooldown write prevents tainting.</tspan></text></g><g class="cDU= write"><g class="shape" ><rect x="142" y="1269" width="440" height="242" stroke="#b45309" fill="#fff3d4" style="stroke-width:2;" /></g><text x="362" y="1307.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="362" dy="0">5. Continuation</tspan><tspan x="362" dy="16.416667"> </tspan><tspan x="362" dy="16.416667">The pre-mitigation Job runs first.</tspan><tspan x="362" dy="16.416667">Pending Jobs and Block failures stop progress.</tspan><tspan x="362" dy="16.416667">The controller then drains and launches the</tspan><tspan x="362" dy="16.416667">mitigation Job. Pre-mitigation Job waits do not</tspan><tspan x="362" dy="16.416667">count against the drain timeout.</tspan><tspan x="362" dy="16.416667"> </tspan><tspan x="362" dy="16.416667">ends here when: the steps are complete, the drain stalls</tspan><tspan x="362" dy="16.416667">without a mitigation Job, or progress is blocked.</tspan><tspan x="362" dy="16.416667">A mitigation without the taint ends once its condition</tspan><tspan x="362" dy="16.416667">recovers and its pre-mitigation Job finishes.</tspan></text></g><g class="KHNyYyAtJmd0OyBwMSlbMF0= spine"><marker id="mk-d2-737221423-1628587456" markerWidth="16" markerHeight="20" refX="10" refY="10" viewBox="0 0 16 20" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 16,10 0,20" fill="#4f46e5" class="connection" stroke-width="4" /> </marker><path d="M 362.75 81 L 362.75 116" stroke="#4f46e5" fill="none" class="connection" style="stroke-width:4;" marker-end="url(#mk-d2-737221423-1628587456)" mask="url(#d2-737221423)" /></g><g class="KHAxIC0mZ3Q7IHAyKVswXQ== spine"><path d="M 362.75 272 L 362.75 373" stroke="#4f46e5" fill="none" class="connection" style="stroke-width:4;" marker-end="url(#mk-d2-737221423-1628587456)" mask="url(#d2-737221423)" /><text x="362.5" y="330" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">ok</text></g><g class="KHAyIC0mZ3Q7IHAzKVswXQ== spine"><path d="M 232.5 529 L 232.5 665" stroke="#4f46e5" fill="none" class="connection" style="stroke-width:4;" marker-end="url(#mk-d2-737221423-1628587456)" mask="url(#d2-737221423)" /><text x="233" y="605" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">new or more aggressive steps</text></g><g class="KHAzIC0mZ3Q7IHA0KVswXQ== spine"><path d="M 232.5 837 L 232.5 970" stroke="#4f46e5" fill="none" class="connection" style="stroke-width:4;" marker-end="url(#mk-d2-737221423-1628587456)" mask="url(#d2-737221423)" /><text x="232.5" y="911" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">allowed</text></g><g class="KHA0IC0mZ3Q7IHA1KVswXQ== spine"><path d="M 289.415985 1126 L 289.415985 1262" stroke="#4f46e5" fill="none" class="connection" style="stroke-width:4;" marker-end="url(#mk-d2-737221423-1628587456)" mask="url(#d2-737221423)" /><text x="289" y="1202" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">committed</text></g><g class="KHAyIC0mZ3Q7IHA1KVswXQ=="><marker id="mk-d2-737221423-859541214" markerWidth="13" markerHeight="16" refX="8.5" refY="8" viewBox="0 0 13 16" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 13,8 0,16" fill="#b45309" class="connection" stroke-width="3" /> </marker><path d="M 493 528.5 L 493 1263.5" stroke="#b45309" fill="none" class="connection" style="stroke-width:3;" marker-end="url(#mk-d2-737221423-859541214)" mask="url(#d2-737221423)" /><text x="493.5" y="887" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="493.5" dy="0">running mitigation, same steps:</tspan><tspan x="493.5" dy="17.666667">skip the gates and continue</tspan><tspan x="493.5" dy="17.666667">where it left off</tspan></text></g><mask id="d2-737221423" maskUnits="userSpaceOnUse" x="-19" y="-19" width="647" height="1561">
