# AKS: terminate through Azure Workload Identity, capture the Node before mitigation, and alert.
# Replace the client ID with your managed identity's. The cluster needs the Azure Workload Identity webhook.
app:
  enabled: true
  config:
    conditions:
      KernelDeadlock:
        taint: true
        drain: true
        # A deadlocked kernel may hang during guest OS shutdown.
        jobEnv:
          FORCE_TERMINATE: "true"
        preMitigationJob:
          name: capture-node
        mitigationJob:
          name: terminate
      ReadonlyFilesystem:
        drain: true
        preMitigationJob:
          name: capture-node
      Manual:
        drainTimeout: "0"
        skipPodDeletion: true
        jobEnv:
          FORCE_TERMINATE: "true"
        mitigationJob:
          name: terminate
    excludeNodeTaints:
      - key: ToBeDeletedByClusterAutoscaler

jobs:
  terminate:
    serviceAccount:
      name: node-mitigator-sa
      annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
        # For an identity in another tenant:
        # azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000000
    template:
      spec:
        backoffLimit: 3
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            containers:
              - name: terminate
                image: mcr.microsoft.com/azure-cli:2.87.0@sha256:e02c9723b6e2296e98f54eeb3630b95206aef06aa04251e097ce8390904ba396
                command: ["sh", "-c"]
                args:
                  - |
                    set -eu
                    # providerID: azure:///subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/virtualMachineScaleSets/<vmss>/virtualMachines/<id>
                    vm="${NODE_PROBLEM_MITIGATOR_PROVIDER_ID#azure://}"
                    echo logging in...
                    az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
                      --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" --output none
                    echo deleting instance...
                    force=false
                    # FORCE_TERMINATE requests force deletion.
                    [ "${FORCE_TERMINATE:-}" = true ] && force=true
                    # az vmss delete-instances has no force flag, so call its ARM operation.
                    az rest --method post --output none \
                      --url "https://management.azure.com${vm%/*/*}/delete?api-version=2025-04-01&forceDeletion=$force" \
                      --body "{\"instanceIds\":[\"${vm##*/}\"]}"
                    echo delete done
  capture-node:
    serviceAccount:
      name: capture-node
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get"]
    template:
      spec:
        backoffLimit: 1
        template:
          spec:
            containers:
              - name: capture
                image: registry.k8s.io/kubectl:v1.35.0
                args: ["get", "node", "$(NODE_PROBLEM_MITIGATOR_NODE_NAME)", "-o", "yaml"]

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
  extraAlerts:
    - alert: NodeProblemMitigatorNodeMitigated
      expr: max by (node_name, condition, tainted) (node_problem_mitigator_node_mitigated_info{condition="KernelDeadlock"}) == 1
      for: 1m
      keep_firing_for: 15m
      labels:
        severity: critical
      annotations:
        summary: Node {{ $labels.node_name }} was mitigated for {{ $labels.condition }}
