# GKE: terminate through Workload Identity, capture the Node before mitigation, and alert.
# Replace the project and Google service account with your own.
app:
  enabled: true
  config:
    conditions:
      KernelDeadlock:
        taint: true
        drain: true
        # A deadlocked kernel may hang during guest OS shutdown.
        jobEnv:
          FORCE_TERMINATE: "true"
        preMitigationJob:
          name: capture-node
        mitigationJob:
          name: terminate
      ReadonlyFilesystem:
        drain: true
        preMitigationJob:
          name: capture-node
      Manual:
        drainTimeout: "0"
        skipPodDeletion: true
        jobEnv:
          FORCE_TERMINATE: "true"
        mitigationJob:
          name: terminate
    excludeNodeTaints:
      - key: ToBeDeletedByClusterAutoscaler

jobs:
  terminate:
    serviceAccount:
      name: node-mitigator-sa
      annotations:
        iam.gke.io/gcp-service-account: node-problem-mitigator@my-project.iam.gserviceaccount.com
    template:
      spec:
        backoffLimit: 3
        template:
          spec:
            containers:
              - name: terminate
                image: google/cloud-sdk:583.0.0-slim@sha256:df30191e2435b838d0d6e07c228ced843829703c9f966c0163175bad88b291be
                command: ["sh", "-c"]
                args:
                  - |
                    set -eu
                    # providerID: gce://<project>/<zone>/<instance>
                    path="${NODE_PROBLEM_MITIGATOR_PROVIDER_ID#gce://}"
                    zone="${path#*/}"
                    force=""
                    # FORCE_TERMINATE deletes at once, without the ACPI shutdown.
                    [ "${FORCE_TERMINATE:-}" = true ] && force="--no-graceful-shutdown"
                    gcloud compute instances delete "${path##*/}" \
                      --project "${path%%/*}" --zone "${zone%%/*}" --quiet $force
  capture-node:
    serviceAccount:
      name: capture-node
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get"]
    template:
      spec:
        backoffLimit: 1
        template:
          spec:
            containers:
              - name: capture
                image: registry.k8s.io/kubectl:v1.35.0
                args: ["get", "node", "$(NODE_PROBLEM_MITIGATOR_NODE_NAME)", "-o", "yaml"]

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
  extraAlerts:
    - alert: NodeProblemMitigatorNodeMitigated
      expr: max by (node_name, condition, tainted) (node_problem_mitigator_node_mitigated_info{condition="KernelDeadlock"}) == 1
      for: 1m
      keep_firing_for: 15m
      labels:
        severity: critical
      annotations:
        summary: Node {{ $labels.node_name }} was mitigated for {{ $labels.condition }}
