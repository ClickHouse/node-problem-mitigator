name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without build metadata or the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  prepare:
    needs: ci
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          number='(0|[1-9][0-9]*)'
          identifier="(${number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          semver="^${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          [[ "${version}" =~ ${semver} ]] || {
            echo "release version must be valid SemVer without build metadata or the v prefix" >&2
            exit 1
          }
          if (( ${#version} > 128 )); then
            echo "release version exceeds the 128-character OCI tag limit" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          else
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "normal releases must be cut from a commit on main" >&2
              exit 1
            }
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  binaries:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-build
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" \
            -o release-build/node-problem-mitigator ./cmd
          archive="node-problem-mitigator_${RELEASE_VERSION}_${GOOS}_${GOARCH}.tar.gz"
          tar -C release-build -czf "${archive}" node-problem-mitigator
          sha256sum "${archive}" > "${archive}.sha256"

      # Attestations on private repositories depend on the GitHub plan.
      - name: Attest binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-path: node-problem-mitigator_*.tar.gz

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            node-problem-mitigator_*.tar.gz
            node-problem-mitigator_*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${IMAGE_REPOSITORY,,}"
          # The source label links the package to this repository on first publish.
          image_ref="$(KO_DOCKER_REPO="${IMAGE_REPOSITORY}" ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --image-label "org.opencontainers.image.source=${SOURCE_URL}" \
            --image-annotation "org.opencontainers.image.source=${SOURCE_URL}" \
            --tags "${RELEASE_VERSION}" ./cmd/)"
          digest="${image_ref##*@}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "unexpected ko output: ${image_ref}" >&2
            exit 1
          }
          {
            echo "name=${IMAGE_REPOSITORY}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  chart:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish chart
        id: publish
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/chart"
          helm package helm/node-problem-mitigator \
            --destination "${RUNNER_TEMP}/chart" \
            --version "${RELEASE_VERSION}" \
            --app-version "${RELEASE_VERSION}"
          owner="${GITHUB_REPOSITORY%%/*}"
          owner="${owner,,}"
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          helm push "${RUNNER_TEMP}/chart/node-problem-mitigator-${RELEASE_VERSION}.tgz" \
            "oci://ghcr.io/${owner}/charts"
          chart="ghcr.io/${owner}/charts/node-problem-mitigator"
          digest="sha256:$(skopeo inspect --raw "docker://${chart}:${RELEASE_VERSION}" | sha256sum | cut -d ' ' -f 1)"
          {
            echo "name=${chart}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  github_release:
    needs:
      - prepare
      - binaries
      - image
      - chart
    if: >-
      needs.prepare.result == 'success' &&
      needs.binaries.result == 'success' &&
      needs.image.result == 'success' &&
      needs.chart.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            "${RUNNER_TEMP}"/release/* \
            --title "node-problem-mitigator ${RELEASE_TAG}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${args[@]}"
